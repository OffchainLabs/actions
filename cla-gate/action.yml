name: actions/cla-gate
description: "Post a commit status that passes PRs from org members, and otherwise waits for CLA Assistant's license/cla"
inputs:
  client-id:
    description: "Client ID of a GitHub App installed on the org with read access to members"
    required: true
  private-key:
    description: "Private key of that GitHub App"
    required: true
  allowlist:
    description: "The repo's CLA Assistant allowlist, copied as is: comma-separated GitHub logins or commit author names, where `*` matches anything"
    required: false
    default: ""
  context:
    description: "Name of the commit status to post. Make it a required status check"
    required: false
    default: "cla-gate"
  github-token:
    description: "Token used to read the PR and post the status"
    required: false
    default: ${{ github.token }}
runs:
  using: "composite"
  steps:
    # GITHUB_TOKEN can't see private org members. Fork PRs and status events
    # rely on license/cla alone, so they don't check membership
    - name: Create membership token
      id: members
      if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        permission-members: read

    - name: Post CLA gate status
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        MEMBERS_TOKEN: ${{ steps.members.outputs.token }}
        ALLOWLIST: ${{ inputs.allowlist }}
        CONTEXT: ${{ inputs.context }}
      run: ${{ github.action_path }}/check.sh
